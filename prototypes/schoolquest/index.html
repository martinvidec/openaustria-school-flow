<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SchoolQuest — Volksschule 1–4</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/store.js"></script>
  <script src="js/engine/quest-engine.js"></script>
  <script src="js/engine/verteilung.js"></script>
  <script src="js/engine/progress.js"></script>
  <script src="js/views/schueler.js"></script>
  <script src="js/views/lehrer.js"></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>🎓 SchoolQuest</h1>
    <nav class="ansicht-switcher" role="tablist" aria-label="Ansichten">
      <button class="ansicht-btn aktiv" data-ansicht="schueler" role="tab" aria-selected="true">Schüler</button>
      <button class="ansicht-btn" data-ansicht="lehrer" role="tab" aria-selected="false">Lehrer</button>
      <button class="ansicht-btn" data-ansicht="landkarte" role="tab" aria-selected="false">Landkarte</button>
    </nav>
  </header>

  <main id="app">
    <section class="ansicht" id="ansicht-schueler" data-ansicht-panel="schueler">
      <p class="loading-hint">Lade Quests…</p>
    </section>

    <section class="ansicht" id="ansicht-lehrer" data-ansicht-panel="lehrer" hidden>
      <div class="placeholder-card">
        <h2>🧑‍🏫 Lehrer-Dashboard</h2>
        <p>Das Lehrer-Dashboard wird in Issue #203 (#6) implementiert.</p>
      </div>
    </section>

    <section class="ansicht" id="ansicht-landkarte" data-ansicht-panel="landkarte" hidden>
      <div class="placeholder-card">
        <h2>🗺️ Lernlandkarte</h2>
        <p>Die Lernlandkarte wird in Issue #204 (#7) implementiert.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>SchoolQuest — UI-Prototyp · kein Backend, Daten bleiben lokal</span>
    <button id="btn-export" type="button">⬇ Export</button>
    <button id="btn-import" type="button">⬆ Import</button>
    <button id="btn-reset" type="button">🗑 Zurücksetzen</button>
    <input type="file" id="file-import" accept="application/json" hidden />
  </footer>
</body>
</html>
